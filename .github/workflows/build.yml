name: build

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.2.3)'
        required: true
        default: ''
      description:
        description: 'Release description'
        required: false
        default: ''
      publish:
        description: '是否创建 GitHub Release?'
        required: false
        default: false
        type: boolean

env:
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build project for Linux (non-inline)
        run: cargo build --release --locked --no-default-features --features "download-binaries"
      - name: Copy model folder for Linux
        run: cp -r ./model ./target/release/
      - name: Zip Linux artifacts
        run: |
          cd ./target/release
          zip -r x86_64-unknown-linux-gnu.zip ddddocr model
          mv x86_64-unknown-linux-gnu.zip ../x86_64-unknown-linux-gnu.zip
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: x86_64-unknown-linux-gnu
          path: ./target/x86_64-unknown-linux-gnu.zip

  build-linux-inline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build project for Linux (inline-model)
        run: cargo build --release --locked
      - name: Zip Linux inline artifacts
        run: |
          cd ./target/release
          zip -r x86_64-unknown-linux-gnu-inline.zip ddddocr
          mv x86_64-unknown-linux-gnu-inline.zip ../x86_64-unknown-linux-gnu-inline.zip
      - name: Upload Linux inline artifact
        uses: actions/upload-artifact@v4
        with:
          name: x86_64-unknown-linux-gnu-inline
          path: ./target/x86_64-unknown-linux-gnu-inline.zip

  build-aarch64-linux:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Build project for AArch64 Linux (non-inline)
        run: |
          cargo build --release --locked --target aarch64-unknown-linux-gnu --no-default-features --features "download-binaries"
      - name: Copy model folder for AArch64 Linux
        run: cp -r ./model ./target/aarch64-unknown-linux-gnu/release/
      - name: Zip AArch64 Linux artifacts
        run: |
          cd ./target/aarch64-unknown-linux-gnu/release
          zip -r aarch64-linux.zip ddddocr model
          mv aarch64-linux.zip ../../aarch64-unknown-linux-gnu.zip
      - name: Upload AArch64 Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: aarch64-unknown-linux-gnu
          path: ./target/aarch64-unknown-linux-gnu.zip

  build-aarch64-linux-inline:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Build project for AArch64 Linux (inline-model)
        run: |
          cargo build --release --locked --target aarch64-unknown-linux-gnu
      - name: Zip inline AArch64 Linux artifacts
        run: |
          cd ./target/aarch64-unknown-linux-gnu/release
          zip -r aarch64-linux-inline.zip ddddocr
          mv aarch64-linux-inline.zip ../../aarch64-unknown-linux-gnu-inline.zip
      - name: Upload AArch64 Linux inline artifact
        uses: actions/upload-artifact@v4
        with:
          name: aarch64-unknown-linux-gnu-inline
          path: ./target/aarch64-unknown-linux-gnu-inline.zip

  release:
    permissions:
      contents: write
    if: ${{ inputs.publish }}
    needs:
      - build-linux
      - build-linux-inline
      - build-aarch64-linux
      - build-aarch64-linux-inline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.event.inputs.version }}
          release_name: ${{ github.event.inputs.version }}
          body: ${{ github.event.inputs.description }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '**'
          merge-multiple: true
          path: artifacts/
      - name: Attach artifacts to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.version }}
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
